name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # Web 版（Lambda）と同じ版

      - name: 依存パッケージを入れる
        run: pip install -r web/requirements.txt

      # 学習済みモデルはリポジトリに含めないので、モデルを使うテストはスキップされる
      - name: テストを実行する
        run: python -m unittest discover -s tests -v
